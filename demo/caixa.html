<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grupo Horizonte e Mirante · Caixa e compromissos · Exact BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0D0F1A;--orange:#F97316;--osoft:#FFF7ED;--off:#FAFAF7;--ink:#0D0F1A;--g7:#374151;--g5:#6B7280;--g4:#9CA3AF;--g3:#D1D5DB;--g2:#E5E7EB;--vd:#059669;--vm:#DC2626}
html,body{font-family:'Inter',sans-serif;background:var(--off);color:var(--ink);-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:22px;padding:16px 30px;background:#fff;border-bottom:1px solid var(--g2);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.top .logo{height:21px}
.top .tt h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.03em}
.top .tt .st{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:14px;color:var(--orange);margin-top:1px;line-height:1.2}
.top .tt #sub{font-size:10.5px;color:var(--g5);margin-top:3px}
.ents{display:flex;gap:4px;margin-left:auto;background:var(--g2);padding:3px;border-radius:8px}
.ents button{border:0;background:transparent;padding:7px 15px;border-radius:6px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;color:var(--g5)}
.ents button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pbt{border:0;background:var(--orange);color:#fff;padding:9px 16px;border-radius:7px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:11.5px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:24px 30px 60px}
.sec{background:#fff;border:1px solid var(--g2);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.sec>h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
.sec>.sub{font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--g5);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#fff;border:1px solid var(--g2);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.kpi{padding-right:22px;border-right:1px solid var(--g2)}
.kpi:last-child{border-right:0;padding-right:0}.kpi:not(:first-child){padding-left:22px}
.kpi .e{font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--g5);margin-bottom:8px}
.kpi .v{font-family:'Plus Jakarta Sans',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1}
.kpi .v.o{color:var(--orange)}.kpi .v.vd{color:var(--vd)}.kpi .v.vm{color:var(--vm)}
.kpi .s{font-size:10.5px;color:var(--g5);margin-top:6px;line-height:1.45}
.alert{display:flex;gap:12px;align-items:flex-start;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:9px;padding:13px 16px;margin-bottom:16px}
.alert .tg{font-family:'Plus Jakarta Sans',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--vm);white-space:nowrap;padding-top:2px}
.alert p{font-size:12.5px;line-height:1.55;color:#7F1D1D}
.alert p strong{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
thead th{font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--g5);padding:7px 9px;text-align:left;border-bottom:2px solid var(--g3)}
thead th.n{text-align:right}
tbody td{font-size:11.5px;padding:7px 9px;border-bottom:1px solid var(--g2)}
tbody td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
tbody td.l{font-weight:600}
tbody tr.cl{cursor:pointer}
tbody tr.cl:hover{background:var(--osoft)}
tbody tr.hi{background:var(--osoft)}
tbody tr.hi td{font-weight:700}
tbody tr.tot td{border-top:2px solid var(--g3);border-bottom:0;font-weight:800;background:#fff}
.vd{color:var(--vd)}.vm{color:var(--vm)}.dim{color:var(--g3)}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:7px;min-width:760px}
.cal .hd{font-family:'Plus Jakarta Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--g4);text-align:center;padding-bottom:2px}
.cel{border:1px solid var(--g2);border-radius:8px;padding:9px 10px;min-height:76px;cursor:pointer;position:relative;transition:transform .08s}
.cel:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.cel.vz{cursor:default;opacity:.55}.cel.vz:hover{transform:none;box-shadow:none}
.cel.mn{border:2px solid var(--orange)}
.cel .dd{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:800;line-height:1}
.cel .nt{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:700;float:right}
.cel .sl{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;margin-top:16px}
.cel .se{font-size:8px;color:var(--g5);letter-spacing:.09em;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif}
.busca{width:100%;border:1px solid var(--g2);border-radius:7px;padding:8px 11px;font-family:'Inter',sans-serif;font-size:12px;margin-bottom:10px}
.mbg{display:none;position:fixed;inset:0;background:rgba(13,15,26,.55);z-index:100;align-items:center;justify-content:center;padding:24px}
.mbg.on{display:flex}
.mcard{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:84vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--g2)}
.mhead h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:800;letter-spacing:-.02em}
.mhead button{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--g4)}
.mbody{padding:14px 20px 20px;overflow:auto}
.nota{font-size:11.5px;line-height:1.6;color:var(--g7);background:var(--osoft);border:1px solid #FDBA74;border-radius:8px;padding:12px 15px;margin-top:12px}
.nota b{color:var(--ink)}
@media print{
  .top{position:static}.pbt,.ents,.busca{display:none}
  main{max-width:none;padding:0}
  .sec,.kpis{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
  body{background:#fff}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);gap:14px}.kpi{border-right:0;padding:0}.grid2{grid-template-columns:1fr}}
.per{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--g2);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.pres{display:flex;gap:4px;background:var(--g2);padding:3px;border-radius:8px}
.pres button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:700;color:var(--g5)}
.pres button.on{background:var(--navy);color:#fff}
.pdt{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.pdt label{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g5)}
.pdt input{border:1px solid var(--g2);border-radius:6px;padding:6px 9px;font-family:'Inter',sans-serif;font-size:12px}
.pn{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;font-weight:700;color:var(--orange);margin-left:4px}
@media print{.per{display:none}}

  const L=itens().filter(i=>i.lado===lado).sort((a,b)=>a.d.split('/').reverse().join('').localeCompare(b.d.split('/').reverse().join(''))||b.v-a.v);
  const tot=L.reduce((a,b)=>a+b.v,0);
  const rows=L.map(i=>`<tr class="bl" data-t="${(i.nome+' '+i.cat+' '+i.d).toLowerCase()}"><td>${i.d.slice(0,5)}</td><td class="l">${i.nome}</td>
    <td style="color:#6B7280;font-size:10.5px">${i.cat||'—'}</td>${ENT==='consol'?`<td style="font-size:10.5px">${i.emp||''}</td>`:''}
    <td class="n ${lado==='receber'?'vd':'vm'}">${f(i.v)}</td></tr>`).join('');
  return `<div class="sec"><h2>${lado==='receber'?'A receber':'A pagar'} · ${INI===HOJE?'próximos '+nDias()+' dias':pt(INI)+' a '+pt(FIM)}</h2>
    <div class="sub">${L.length} títulos em aberto, somando ${f(tot)}</div>
    <input class="busca" placeholder="filtrar por nome, categoria ou data…" oninput="filtrar(this)">
    <table><thead><tr><th>Venc.</th><th>${lado==='receber'?'Cliente':'Fornecedor'}</th><th>Categoria</th>${ENT==='consol'?'<th>Empresa</th>':''}<th class="n">Valor</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="5" style="color:#9CA3AF">nenhum título na janela</td></tr>'}</tbody></table></div>`;}
function filtrar(el){const q=el.value.toLowerCase();
  el.closest('.sec').querySelectorAll('tbody tr.bl').forEach(tr=>{tr.style.display=tr.dataset.t.includes(q)?'':'none';});}
function abrirDia(d){
  const L=itens().filter(i=>i.d===d).sort((a,b)=>b.v-a.v);
  const r=L.filter(i=>i.lado==='receber'),p=L.filter(i=>i.lado==='pagar');
  const S=serie().find(x=>x.d===d);
  const tb=(A,lado)=>A.length?`<table style="margin-bottom:14px"><thead><tr><th>${lado==='receber'?'Cliente':'Fornecedor'}</th><th>Categoria</th>${ENT==='consol'?'<th>Empresa</th>':''}<th class="n">Valor</th></tr></thead><tbody>
    ${A.map(i=>`<tr><td class="l">${i.nome}</td><td style="color:#6B7280;font-size:10.5px">${i.cat||'—'}</td>${ENT==='consol'?`<td style="font-size:10.5px">${i.emp||''}</td>`:''}<td class="n ${lado==='receber'?'vd':'vm'}">${f(i.v)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td></td>${ENT==='consol'?'<td></td>':''}<td class="n">${f(A.reduce((a,b)=>a+b.v,0))}</td></tr></tbody></table>`:'';
  document.getElementById('mtit').textContent=`${d} · ${E().nome}`;
  document.getElementById('mbody').innerHTML=
    `<p style="font-size:12.5px;color:#374151;margin-bottom:12px">Saldo ao fim do dia: <b>${f(S.saldo)}</b> · entra ${f(S.ent)} · sai ${f(S.sai)}</p>`
    +(r.length?'<h2 style="font-size:10px;letter-spacing:.14em;color:#059669;font-weight:700;margin-bottom:6px">RECEBIMENTOS</h2>':'')+tb(r,'receber')
    +(p.length?'<h2 style="font-size:10px;letter-spacing:.14em;color:#DC2626;font-weight:700;margin-bottom:6px">PAGAMENTOS</h2>':'')+tb(p,'pagar');
  document.getElementById('mbg').classList.add('on');}
function fechar(){document.getElementById('mbg').classList.remove('on');}
function setEnt(e){ENT=e;render();}
function toggleInter(){SEMINTER=!SEMINTER;render();}
function render(){
  const x=E(),S=serie(),K=kpis(S);
  document.getElementById('ents').innerHTML=['horizonte','mirante','consol']
    .map(e=>`<button class="${e===ENT?'on':''}" onclick="setEnt('${e}')">${D.ents[e].nome}</button>`).join('');
  document.getElementById('sub').textContent=
    `período de ${pt(INI)} a ${pt(FIM)} · gerado em ${D.meta.gerado} · âncora de conciliação ${D.meta.ancora}`;
  const neg=x.saldo_hoje<0;
  const alerta=neg?`<div class="alert"><span class="tg">Conciliação pendente</span><p>O saldo apurado para <b>${x.nome}</b> está negativo em <b>${f(x.saldo_hoje)}</b>, o que não corresponde à realidade do banco. Há <b>${x.naoconc} lançamentos não conciliados</b> no período e o recebimento intercompany da compra de diárias ainda não foi lançado deste lado. Trate os números desta aba como incompletos até a conciliação de outubro fechar.</p></div>`:'';
  const inter=x.inter?`<label style="font-size:11.5px;color:#374151;display:flex;gap:7px;align-items:center;margin-bottom:12px"><input type="checkbox" ${SEMINTER?'checked':''} onchange="toggleInter()"> ocultar os ${x.inter} títulos intercompany (Horizonte ↔ Mirante)</label>`:'';
  const contas=x.contas.map(c=>`<tr><td class="l">${c.n}</td><td class="n">${f(c.ini)}</td><td class="n ${c.mov>=0?'vd':'vm'}">${sg(c.mov)}</td><td class="n">${f(c.hoje)}</td><td class="n" style="color:${c.naoconc?'#DC2626':'#9CA3AF'}">${c.naoconc||'—'}</td></tr>`).join('');
  const linhas=S.map(d=>{const net=d.ent-d.sai, vz=!d.ent&&!d.sai;
    return `<tr class="${vz?'':'cl'}${d.d===K.mn.d?' hi':''}" ${vz?'':`onclick="abrirDia('${d.d}')"`}>
      <td class="l">${d.d.slice(0,5)}</td><td style="color:#6B7280;font-size:10.5px">${d.dow}</td>
      <td class="n ${d.ent?'vd':'dim'}">${d.ent?f(d.ent):'—'}</td><td class="n ${d.sai?'vm':'dim'}">${d.sai?f(d.sai):'—'}</td>
      <td class="n ${net>0?'vd':(net<0?'vm':'dim')}">${net?sg(net):'—'}</td><td class="n">${f(d.saldo)}</td></tr>`;}).join('');
  document.getElementById('app').innerHTML=periodoBar()+alerta+`
  <div class="kpis">
    <div class="kpi"><div class="e">Caixa hoje</div><div class="v ${x.saldo_hoje<0?'vm':'o'}">${f(x.saldo_hoje)}</div><div class="s">era ${f(x.contas.reduce((a,b)=>a+b.ini,0))} na âncora de ${D.meta.ancora}</div></div>
    <div class="kpi"><div class="e">A receber · ${nDias()} dias</div><div class="v vd">${f(K.rec)}</div><div class="s">${itens().filter(i=>i.lado==='receber').length} títulos em aberto</div></div>
    <div class="kpi"><div class="e">A pagar · ${nDias()} dias</div><div class="v vm">${f(K.pag)}</div><div class="s">${itens().filter(i=>i.lado==='pagar').length} títulos em aberto</div></div>
    <div class="kpi"><div class="e">Menor saldo</div><div class="v ${K.mn.saldo<0?'vm':''}">${f(K.mn.saldo)}</div><div class="s">em ${K.mn.d} · termina o período em ${f(K.fim)}</div></div>
  </div>
  <div class="sec"><h2>Fluxo de caixa diário</h2><div class="sub">Clique em qualquer dia para ver os títulos. A linha é o saldo; as barras, o que entra e o que sai.</div>
    ${inter}${grafico(S)}</div>
  <div class="sec"><h2>${S.length<=45?'Calendário de caixa':'Resumo por semana'}</h2>
    <div class="sub">${S.length<=45?'O líquido do dia e o saldo com que a empresa dorme':'O período tem '+S.length+' dias — acima de 45 o calendário vira resumo semanal'}</div>
    ${S.length<=45?calendario(S):semanal(S)}</div>
  <div class="sec"><h2>Dia a dia</h2><div class="sub">Clique na linha para abrir os títulos daquele dia</div>
    <table><thead><tr><th>Dia</th><th></th><th class="n">Entradas</th><th class="n">Saídas</th><th class="n">Líquido</th><th class="n">Saldo acumulado</th></tr></thead>
    <tbody>${linhas}<tr class="tot"><td>Total</td><td></td><td class="n vd">${f(K.rec)}</td><td class="n vm">${f(K.pag)}</td><td class="n ${K.rec-K.pag>=0?'vd':'vm'}">${sg(K.rec-K.pag)}</td><td class="n">${f(K.fim)}</td></tr></tbody></table></div>
  <div class="grid2">${lista('receber',S)}${lista('pagar',S)}</div>
  <div class="sec"><h2>Posição por conta</h2><div class="sub">Âncora de ${D.meta.ancora} mais o movimento já conciliado desde então</div>
    <table><thead><tr><th>Conta</th><th class="n">Âncora</th><th class="n">Movimento</th><th class="n">Hoje</th><th class="n">Não conciliados</th></tr></thead>
    <tbody>${contas}<tr class="tot"><td>Total</td><td class="n">${f(x.contas.reduce((a,b)=>a+b.ini,0))}</td><td class="n">${sg(x.contas.reduce((a,b)=>a+b.mov,0))}</td><td class="n">${f(x.saldo_hoje)}</td><td class="n">${x.naoconc||'—'}</td></tr></tbody></table>
    <div class="nota"><b>Vencido e não pago:</b> ${f(x.atrasados.pagar)} a pagar e ${f(x.atrasados.receber)} a receber, em ${x.atrasados.n} títulos vencidos antes de hoje, fora do período selecionado.
    <b>Horizonte carregado:</b> ${D.meta.horizonte} dias de títulos em aberto, de ${D.meta.hoje} a ${D.meta.fim} — o seletor de período trabalha dentro disso.
    <br><br>Este painel mostra <b>posição e compromissos</b>, não previsão: enxerga só o que já está lançado no Omie. Em outubro, dos R$ 200.386,32 pagos pela Horizonte na primeira quinzena, apenas R$ 81.943,07 estavam lançados no dia 30 de setembro — cobertura de <b>41%</b>. Lançar os recorrentes antes do dia 25 fecha 98% dessa lacuna.</div></div>`;
  document.querySelectorAll('.hot').forEach(h=>h.addEventListener('click',()=>abrirDia(h.dataset.d)));}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar();});
render();
</script><div style="position:fixed;left:0;right:0;bottom:0;z-index:999;background:#0D0F1A;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-align:center;padding:7px">DEMONSTRAÇÃO · EMPRESA FICTÍCIA · NÚMEROS REAIS, NOMES SUBSTITUÍDOS</div></body></html>
